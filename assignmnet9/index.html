<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" name="mishra" id="rohan">
    <button onclick="displayText()">CLICK</button>
    <p id="output"></p>

    <script>
        function displayText() {
            const inputText = document.getElementById("rohan").value;
            document.getElementById("output").innerText = inputText;
        }
    </script>
</body>
</html>

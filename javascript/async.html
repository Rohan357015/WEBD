<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async</title>
</head>
<body>
    <script>
        async function f() {
            let promise = new Promise(function(resolve, reject) {
            setTimeout(()=> resolve("done!"), 3000);

        });
        let  result = await promise; 
        alert(result); // wait until the promise resolves (*)

        }
        f();
        const myfun = async() => {
            setTimeout
            (() => {
                console.log("hello");
            }, 2000);
        }
        
        const fun2 = async()=>{
            const res = await myfun();
            console.log(res);
        }
       
    </script>
</body>
</html>
